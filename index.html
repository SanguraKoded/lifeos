<style>

[data-theme=light]{--bg:#eef3fc;--p:#fff;--p2:#e8f0fe;--bd:#cfdcf3;--tx:#14213d;--mu:#5a6b8c;--ac:#2563eb;--ac2:#3b82f6;--wa:#a66f0c;--er:#c0392b;--sh:0 6px 20px #2563eb1a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#1d3a7a33,transparent),var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,Segoe UI,sans-serif;display:flex;min-height:100vh}
[data-theme=light] body{background:radial-gradient(1200px 500px at 70% -10%,#bfd4ff66,transparent),var(--bg)}
aside{width:224px;background:var(--p);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
aside h1{font-size:15px;margin:2px 10px 18px;color:var(--ac2);letter-spacing:.3px}aside a{display:block;padding:9px 12px;margin-bottom:2px;border-radius:8px;color:var(--mu);text-decoration:none;cursor:pointer;border-left:3px solid transparent;transition:.15s}

h2{margin:0 0 18px;font-size:26px;letter-spacing:-.3px}h3{margin:0;font-size:16px}.card{background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:16px}.g .card{margin:0}.hd{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.hd h3{flex:1}
.m{color:var(--mu);font-size:13px}.bar{height:8px;background:var(--p2);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px;transition:width .3s}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;transition:.15s}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px #4c8dff33}
input,select,textarea{width:100%}.hd input,.hd select{width:auto}input[type=checkbox]{width:auto;accent-color:var(--ac)}button{cursor:pointer;width:auto}button:hover{border-color:var(--ac)}
.b{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#fff;border-color:var(--ac);font-weight:600}.b:hover{filter:brightness(1.1)}.d{color:var(--er)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}tr:hover td{background:#4c8dff0d}.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:#4c8dff22;color:var(--ac2);font-size:12px;border:1px solid #4c8dff44}a.l{color:var(--ac2);cursor:pointer;text-decoration:none}a.l:hover{text-decoration:underline}
.st{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bd)}.st.done span{text-decoration:line-through;color:var(--mu)}
summary{cursor:pointer;padding:2px 0}details.card[open] summary{margin-bottom:8px}
dialog{background:var(--p);color:var(--tx);border:1px solid var(--bd);border-radius:14px;width:min(540px,94vw);max-height:90vh;box-shadow:var(--sh)}dialog::backdrop{background:#02061299;backdrop-filter:blur(3px)}dialog label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mu)}

.row select,.row input{width:auto}.warn{border-color:var(--wa)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:8px;gap:2px}aside h1{display:none}aside a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;margin:0}aside a.on{border-bottom-color:var(--ac)}main{padding:16px}}
</style></head><body>

essages every morning","Not 5 per week. 5 per day. Rejection is data. Persistence is strategy.","📨 Sales","⬜"],["🏗 Phase 1\n(Year 1)","Deliver every client project one day early","Under-promise, over-deliver. This single habit generates more referrals than any marketing.","✅ Trust","⬜"],["🏗 Phase 1\n(Year 1)","Learn one non-technical business skill per month","Sales, writing, pricing, negotiation, project management. These compound like interest.","📚 Growth","⬜"],["🌱 Phase 2+\n(Year 2+)","Weekly team meeting — every Monday, no exceptions","Alignment, blockers, wins. 30 minutes. Keeps the team moving in the same direction.","👥 Team","⬜"],["🌱 Phase 2+\n(Year 2+)","Review your numbers every Friday","MRR, pipeline, margins, burn. If you don't know your numbers, you can't steer the company.","📊 Finance","⬜"],["🌍 All Phases","Read 30 minutes every day","Business books, industry reports, competitor analysis. Leaders are readers.","📖 Learn","⬜"],["🌍 All Phases","Sleep 7–8 hours every night","Your best decisions, code, and client conversations come from a rested brain. Non-negotiable.","😴 Health","⬜"],["🌍 All Phases","Exercise 3–5x per week","A healthy body powers a sharp mind. The grind is long — your body is your vehicle.","💪 Health","⬜"],["🌍 All Phases","Quarterly review of your roadmap","Open this file. Check what you said you'd do. Did you? Adjust. Re-commit.","🗓 Review","⬜"],["🌍 All Phases","Never stop being a student","The most dangerous belief in business is 'I know enough now.' The market will prove you wrong.","🎓 Mindset","⬜"],["🌍 All Phases","Celebrate your wins — every single one","First GitHub push. First paid client. First hire. First million. Mark them. They matter.","🎉 Celebrate","⬜"]]},{"title":"🏆  THIS IS YOUR MANIFESTO, JAMES SANGURA.\n\nYou are 26 years old in Nairobi. You have a plan. You have a curriculum. You have a roadmap.\nThe only variable left is whether you show up — every single day — when it is hard, when it is slow, and when no one is watching async function load(){try{const db=await idb();S={...S,...await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result||{});q.onerror=()=>rej(q.error)})}}catch(e){usingLS=true;try{S={...S,...JSON.parse(localStorage.getItem('lifeos-state')||'{}')}}catch(_){}}}
