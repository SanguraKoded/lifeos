–5M/month","header":["WHEN",null,"MILESTONE","HOW / DETAIL",null,"✓"],"rows":[["Year 3 Q1",null,"👥 Team  Grow to 8–15 people","Engineering: 3–4 DEs · Consulting: 2 BAs + 1 PM · Growth: 1 marketer + 1 sales",null,"⬜"],["Year 3 Q1",null,"🎯 CEO shift  Stop writing most production code","This is hard but necessary · Your job is vision, sales, clients, and culture",null,"⬜"],["Year 3 Q2",null,"🏢 Structure  Build departments, not just headcount","Each department has a lead · Weekly team meetings · Quarterly reviews · OKRs",null,"⬜"],["Year 3 Q2",null,"💰 Sales  Implement a sales process","CRM (HubSpot free tier) · Pipeline stages · Follow-up cadence · Win/loss tracking",null,"⬜"],["Year 3 Q3",null,"💰 Pricing  Price for value, not time","Enterprise clients pay for outcomes not hours · Price projects at KES 500k–2M",null,"⬜"],["Year 3 Q3",null,"✍️ Thought Leadership  Start publishing proprietary research","Kenya Data Trends report · Kenyan SME Digitization report · Builds enormous credibility",null,"⬜"],["Year 3 Q4",null,"🎯 Enterprise  Seek your first enterprise contract","Kenyan bank, telecom, or government agency · 12-month contract · KES 500k–1M/mo",null,"⬜"]]},{"title":"🌍 PHASE 4 — AFRICAN BRAND (Years 4–5)  —  Revenue: KES 5–20M/month","header":["WHEN",null,"MILESTONE","HOW / DETAIL",null,"✓"],"rows":[["Year 4",null,"🌍 Expansion  Open Kampala office (or representative)","Remote-first to start · Hire a local DE · Use your Kenya reputation to open doors in Uganda",null,"⬜"],["Year 4",null,"🌍 Expansion  Open Kigali presence","Rwanda is the most startup-friendly country in Africa · English-speaking · Very tech-forward",null,"⬜"],["Year 5",null,"🌍 Expansion  Open Dar es Salaam presence","Tanzania is a massive market · Strong banking and logistics sectors",null,"⬜"],["Year 4",null,"🤝 Partnership  Become official AWS Partner","AWS Partner Network (APN) · Co-selling with AWS · Access to AWS credits for your clients",null,"⬜"],["Year 4",null,"🤝 Partnership  Pursue GCP or Azure partnership","Diversify cloud partnerships · Some clients prefer GCP (especially media/health) or Azure (enterprise)",null,"⬜"],["Year 5",null,"🏭 Industries  Target Healthcare, Banking, Retail, Logistics, Government","These 5 sectors have the most data pain and the most budget · Build sector-specific teams",null,"⬜"],["Year 5",null,"📦 Product  Launch Managed Data Platform service","Fully managed ETL + warehouse + dashboards · Monthly subscription · KES 200k–500k/client/mo",null,"⬜"]]}]},{"sheet":"🚀 Phases 5–8 — Empire","title":"🚀  PHASES 5–8 — EMPIRE  ·  Years 5–15+  ·  SaaS Products → AI Company → Global Leader → Legacy","sections":[{"title":"📦 PHASE 5 — LAUNCH PRODUCTS (Years 5–7)  —  KES 20–100M/month","header":["WHEN",null,"MILESTONE","HOW / DETAIL",null,"✓"],"rows":[["Year 5",null,"💡 Insight  Identify recurring client pain points","After 2+ years of consulting, you see the same problems repeatedly — these become your products",null,"⬜"],["Year 5–6",null,"📦 SaaS  Build SME Analytics Platform","SaaS: Kenya SMEs subscribe for KES 5k–20k/mo · Automated reports, no coding required",null,"⬜"],["Year 5–6",null,"📦 SaaS  Build Healthcare Data Platform","Kenyan hospitals and clinics · Patient data management + analytics · High value, high need",null,"⬜"],["Year 6",null,"🤖 AI Product  Build AI Reporting Assistant","Natural language → SQL → Chart · 'What were my top products last week?' → instant answer",null,"⬜"],["Year 6–7",null,"📦 SaaS  Build Inventory Intelligence Platform","For Kenyan retailers and distributors · Demand forecasting + reorder alerts · Huge market",null,"⬜"],["Year 7",null,"💰 Scale  Products become largest revenue source","Consulting funds product development · Products scale without proportional headcount increase",null,"⬜"]]},{"title":"🤖 PHASE 6 — AI COMPANY (Years 7–10)  —  KES 100M+/month","header":["WHEN",null,"MILESTONE","HOW / DETAIL",null,"✓"],"rows":[["Year 7",null,"🔬 Research  Create AI Research division","Hire AI Engineers, Data Scientists, ML Engineers · Focus on African problems, African data",null,"⬜"],["Year 7–8",null,"🎓 Academy  Launch Training Academy","Train Kenyan engineers in data engineering · Certificate programs · Generates revenue + talent pipeline",null,"⬜"],["Year 8",null,"🏫 University  Partner with Kenyan universities","Strathmore, USIU, UoN · Research partnerships · Student internship pipeline · Academic credibility",null,"⬜"],["Year 8",null,"📄 Research  Publish AI research","African language NLP, agricultural data models, healthcare AI for East Africa · Builds global reputation",null,"⬜"],["Year 9",null,"☁️ Managed  Managed Cloud Services","Full outsourced cloud management for enterprise clients · Very sticky revenue",null,"⬜"],["Year 10",null,"🏢 Divisions  Expand divisions: Consulting + SaaS + AI Research + Academy + Cloud","5 revenue streams · Diversified · Resilient to any single market change",null,"⬜"]]},{"title":"🌐 PHASE 7 — GLOBAL (Years 10–15)  —  Hundreds of M KES/month","header":["WHEN",null,"MILESTONE","HOW / DETAIL",null,"✓"],"rows":[["Year 10–11",null,"🌍 Global  Serve clients in Europe and Middle East","Remote delivery model · Premium pricing · European compliance expertise (GDPR) is a differentiator",null,"⬜"],["Year 11–12",null,"🌍 Global  Enter North American market","Partner with US-based firms as their African delivery center · Cost-effective for them",null,"⬜"],["Year 12",null,"🤝 M&A  Acquire smaller consulting firms","Buy a 5–10 person data firm in Uganda or Rwanda · Instant market presence and team",null,"⬜"],["Year 13",null,"🤝 Enterprise  Become trusted enterprise implementation partner","For Salesforce, SAP, Oracle in Africa · This is how major consulting firms are built",null,"⬜"],["Year 14",null,"🤖 Global AI  Launch proprietary AI products for global market","Your African-context AI models trained on unique data · Global companies pay premium for this",null,"⬜"],["Year 15",null,"🏆 Scale  Revenue: Hundreds of millions KES annually","Operating across Africa, Europe, Middle East, North America · 200–500 employees globally",null,"⬜"]]},{"title":"🏛 PHASE 8 — LEGACY (Year 15+)  —  Generational Impact","header":["WHEN",null,"MILESTONE","HOW / DETAIL",null,"✓"],"rows":[["Year 15+",null,"💰 VC  Venture Capital arm","Invest in African tech startups · Use your expertise to help the next generation · Multiplies impact",null,"⬜"],["Year 15+",null,"🎓 Academy  Engineering Training Academy at scale","Train thousands of engineers per year · Solve Africa's data engineering talent shortage",null,"⬜"],["Year 15+",null,"🔓 Open Source  Open-source tools","Release tools built internally as open source · Raises company profile · Attracts global talent",null,"⬜"],["Year 15+",null,"🔀 Adjacent  Expand into cybersecurity, enterprise software, digital health","Natural extensions of data expertise · Each sector needs trusted data infrastructure",null,"⬜"],["Year 15+",null,"🏛 Legacy  The company is known for what it stands for","Data Engineering · AI Solutions · Cloud Transformation · Digital Africa · This is your legacy",null,"⬜"]]}]},{"sheet":"🧠 Skills Beyond Tech","title":"🧠  SKILLS BEYOND TECHNICAL KNOWLEDGE  —  What Separates a Coder from a Company Builder","sections":[{"title":"Python gets you the first client. These skills build the company.","header":null,"rows":[]},{"title":"📅 Year 1  —  Sales & Communication","header":[null,null,"SKILL","WHAT IT MEANS & HOW TO LEARN IT",null,"✓"],"rows":[["Writing",null,"Write proposals, emails, and case studies that make people say yes","Book: 'Made to Stick' by Chip Heath · Practice: write one LinkedIn post every day",null,"⬜"],["Cold Outreach",null,"Reach 20 new businesses every month without fear","Book: 'Never Split the Difference' — Chris Voss · Practice: 5 cold DMs per day",null,"⬜"],["Presentation",null,"Present your work clearly to non-technical clients","Structure: Problem → What I built → Results in numbers → What's next",null,"⬜"],["Listening",null,"Understand what clients actually need, not just what they say they need","Ask: 'What would success look like for you in 6 months?' Then listen.",null,"⬜"]]},{"title":"📅 Year 2  —  Project Management & Client Relations","header":[null,null,"SKILL","WHAT IT MEANS & HOW TO LEARN IT",null,"✓"],"rows":[["Project Management",null,"Deliver every project on time, within scope, and at quality","Tool: Notion or Trello · Method: weekly client updates, no surprises",null,"⬜"],["Scope Management",null,"Know how to handle scope creep without losing the client","Always get scope in writing · Change = new proposal · Be firm but kind",null,"⬜"],["Negotiation",null,"Win engagements at your price without discounting unnecessarily","Book: 'Getting to Yes' by Fisher & Ury · Rule: never name a price first",null,"⬜"],["Conflict Resolution",null,"Handle unhappy clients professionally","Listen first · Offer solutions not excuses · Fix it fast · Learn from it",null,"⬜"]]},{"title":"📅 Year 3  —  Hiring, Coaching & Financial Management","header":[null,null,"SKILL","WHAT IT MEANS & HOW TO LEARN IT",null,"✓"],"rows":[["Hiring",null,"Find and keep talented engineers in a competitive market","Hire for attitude, train for skill · Pay above market · Give ownership of work",null,"⬜"],["Coaching",null,"Develop junior engineers into senior contributors","Weekly 1:1s · Give stretch projects · Provide feedback immediately, not annually",null,"⬜"],["Financial Management",null,"Run the business profitably and know your numbers","Track: MRR, churn, project margins, burn rate · Tool: QuickBooks or Wave (free)",null,"⬜"],["Culture Building",null,"Build a team people want to work in","Define your values · Live them visibly · Celebrate wins publicly",null,"⬜"]]},{"title":"📅 Years 4–5  —  Strategy, Partnerships & Operations","header":[null,null,"SKILL","WHAT IT MEANS & HOW TO LEARN IT",null,"✓"],"rows":[["Business Strategy",null,"Decide where to compete and where to avoid","Read: 'Good Strategy Bad Strategy' by Richard Rumelt · Review strategy quarterly",null,"⬜"],["Partnership Building",null,"Build alliances with AWS, GCP, enterprise software firms","Attend AWS re:Invent · Apply for partner programs · Co-sell with partners",null,"⬜"],["Operations",null,"Build systems so the company runs without you in every detail","Document every process · Build SOPs · Hire operations manager by Year 4",null,"⬜"],["Market Expansion",null,"Enter new geographies without losing focus","One new country at a time · Local hire first · Remote-first to start",null,"⬜"]]},{"title":"📅 Year 5+  —  Leadership, Vision & Legacy","header":[null,null,"SKILL","WHAT IT MEANS & HOW TO LEARN IT",null,"✓"],"rows":[["Leadership",null,"Inspire 50–200 people toward a shared goal","Book: 'Leaders Eat Last' by Simon Sinek · Be the person you want your team to become",null,"⬜"],["Fundraising (optional)",null,"Know when and how to raise venture capital","Only raise if product revenue needs acceleration · Understand dilution and term sheets",null,"⬜"],["Long-term Vision",null,"Think in decades, not quarters","Where is Africa's data economy in 2040? Position your company to be there.",null,"⬜"],["Giving Back",null,"Train the next generation of African engineers","Academy · Open source · University partnerships · Mentorship programmes",null,"⬜"]]}]},{"sheet":"⚙️ Daily Discipline","title":"⚙️  DAILY DISCIPLINE ENGINE  —  The Habits That Compound Into An Empire","sections":[{"title":"(untitled)","header":["PHASE","DAILY HABIT","WHY IT MATTERS","CATEGORY","✓ DOING?"],"rows":[["⚡ Phase 0\n(Days 1–75)","Study 4+ hours of curriculum every day","No exceptions. This is your full-time job right now. Treat it that way.","🎯 Foundation","⬜"],["⚡ Phase 0\n(Days 1–75)","Push code to GitHub every day","Your GitHub commit history IS your portfolio. Green squares build credibility.","💻 Build","⬜"],["⚡ Phase 0\n(Days 1–75)","Write one LinkedIn post every day","Documenting your learning builds an audience BEFORE you have clients to show.","📢 Brand","⬜"],["🏗 Phase 1\n(Year 1)","Send 5 cold outreach messages every morning","Not 5 per week. 5 per day. Rejection is data. Persistence is strategy.","📨 Sales","⬜"],["🏗 Phase 1\n(Year 1)","Deliver every client project one day early","Under-promise, over-deliver. This single habit generates more referrals than any marketing.","✅ Trust","⬜"],["🏗 Phase 1\n(Year 1)","Learn one non-technical business skill per month","Sales, writing, pricing, negotiation, project management. These compound like interest.","📚 Growth","⬜"],["🌱 Phase 2+\n(Year 2+)","Weekly team meeting — every Monday, no exceptions","Alignment, blockers, wins. 30 minutes. Keeps the team moving in the same direction.","👥 Team","⬜"],["🌱 Phase 2+\n(Year 2+)","Review your numbers every Friday","MRR, pipeline, margins, burn. If you don't know your numbers, you can't steer the company.","📊 Finance","⬜"],["🌍 All Phases","Read 30 minutes every day","Business books, industry reports, competitor analysis. Leaders are readers.","📖 Learn","⬜"],["🌍 All Phases","Sleep 7–8 hours every night","Your best decisions, code, and client conversations come from a rested brain. Non-negotiable.","😴 Health","⬜"],["🌍 All Phases","Exercise 3–5x per week","A healthy body powers a sharp mind. The grind is long — your body is your vehicle.","💪 Health","⬜"],["🌍 All Phases","Quarterly review of your roadmap","Open this file. Check what you said you'd do. Did you? Adjust. Re-commit.","🗓 Review","⬜"],["🌍 All Phases","Never stop being a student","The most dangerous belief in business is 'I know enough now.' The market will prove you wrong.","🎓 Mindset","⬜"],["🌍 All Phases","Celebrate your wins — every single one","First GitHub push. First paid client. First hire. First million. Mark them. They matter.","🎉 Celebrate","⬜"]]},{"title":"🏆  THIS IS YOUR MANIFESTO, JAMES SANGURA.\n\nYou are 26 years old in Nairobi. You have a plan. You have a curriculum. You have a roadmap.\nThe only variable left is whether you show up — every single day — when it is hard, when it is slow, and when no on (function w(o){for(const k in o){const v=o[k];if(typeof v==='string')o[k]=ne(v);else if(v&&typeof v==='object')w(v)}})(DATA);
const $=s=>document.querySelector(s),dlg=$('#dlg'),L=DATA.lessons,RM=DATA.roadmap,DONE=['Completed','Mastered'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=n=>'KES '+Number(n||0).toLocaleString('en-KE');
const addD=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const wkStart=()=>{const t=today(),d=new Date(t+'T00:00:00Z').getUTCDay();return addD(t,-((d+6)%7))};
const KEYS=['lp','sp','notes','ev','stepLog','mins','proj','rm','hab','rev','col','misc','avail'];
let S={lp:{},sp:{},notes:{},ev:{},stepLog:{},mins:{},proj:{},rm:{},hab:{},rev:{},col:{},misc:{},avail:60},timer,usingLS=false;
const stepsTotal=L.reduce((a,l)=>a+l.steps.length,0);
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('lifeos-james',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){try{const db=await idb();S={...S,...await new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result||{});q.onerror=()=>rej(q.error)})}}catch(e){usingLS=true;try{S={...S,...JSON.parse(localStorage.getItem('lifeos-state')||'{}')}}catch(_){}}}
function save(){clearTimeout(timer);timer=setTimeout(async()=>{try{if(usingLS)throw 0;const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'state')}catch(e){try{localStorage.setItem('lifeos-state',JSON.stringify(S))}catch(_){toast('Could not save to browser storage',1)}}},200)}
function toast(m,er){const t=$('#toast');t.textContent=m;t.className=er?'er':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)}
const st=d=>(S.lp[d]||{}).st||'Not started',ST=['Not started','In progress','Practised','Completed','Mastered'];
const sdone=l=>l.steps.filter(s=>S.sp[l.day+'.'+s.n]).length;
const doneSteps=()=>Object.values(S.sp).filter(Boolean).length;
const cur=()=>L.find(l=>!DONE.includes(st(l.day)));
const lastDone=()=>[...L].reverse().find(l=>DONE.includes(st(l.day)));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const bar=p=>`<div class=bar><i style="width:${p}%"></i></div>`;
const PR=(()=>{let p=0;return DATA.projects.map(x=>{const o={...x,from:p+1};p=x.dueDay;return o})})();
const pdays=p=>L.filter(l=>l.day>=p.from&&l.day<=p.dueDay);
const pprog=p=>{const ds=pdays(p),t=ds.reduce((a,l)=>a+l.steps.length,0),d=ds.reduce((a,l)=>a+sdone(l),0);return{t,d,p:pct(d,t)}};
/* ===== Trading hub: session advisor + Excel journal features ===== */
let FXT='now',FXPRE=null;
const FXTABS=[['now','Session advisor'],['log','Trade log'],['jr','Daily journal'],['risk','Risk calculator'],['an','Analytics'],['guide','Playbook']];
const fxt=k=>{FXT=k;render()};
const FXL={dead:'Dead zone',asia:'Asian / Tokyo',lon:'London open',mid:'Midday chop',pre:'Pre-NY open',prime:'NYSE open · prime',ovl:'LDN–NY overlap',nyc:'NY continuation',late:'Late NY',closed:'Market closed'};
const STRATS=['Trend line break + FVG','ORB + FVG','PDH/PDL sweep','Liquidity sweep reversal','Trend Following','Breakout','Mean Reversion','Scalping','Support & Resistance','Price Action','News/Fundamental','Other'];
const SESS=['Not tagged',...Object.values(FXL).slice(0,9)];
const MOODS=['Calm','Confident','Anxious','Excited','Frustrated','Tired','Fear','Greedy','Neutral'];
const EMC={stop:['#ff9a9a','#c81e1e','<path d="M8 8l8 8M16 8l-8 8"/>'],warn:['#ffd877','#d97706','<path d="M12 6.5v7M12 17v.6"/>'],wait:['#9ccbff','#1d4ed8','<path d="M12 6.5V12l3.5 2"/>'],fire:['#ffbd7a','#e8590c','<path d="M12 4.5c.8 3 4 4.2 4 8a4 4 0 01-8 0c0-1.8.9-3 2-4 .1 1.8 1 2 2 1 .4-1.8-.3-3.2 0-5z"/>'],ok:['#8ee8b0','#0f9d58','<path d="M7 12.5l3.2 3.2L17 9"/>'],g:['#8ee8b0','#0f9d58',''],y:['#ffe58a','#d49b00',''],o:['#ffbd7a','#e8590c',''],r:['#ff9a9a','#c81e1e','']};
const em=(k,s=18)=>{if(k==='star'||k==='star0')return`<svg viewBox="0 0 24 24" width="${s}" height="${s}" style="vertical-align:-3px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))"><defs><linearGradient id="esg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".55" stop-color="#f5b800"/><stop offset="1" stop-color="#c47f00"/></linearGradient></defs><polygon points="12,2.5 14.9,8.8 21.7,9.5 16.6,14.1 18.1,20.8 12,17.4 5.9,20.8 7.4,14.1 2.3,9.5 9.1,8.8" fill="${k==='star'?'url(#esg)':'rgba(150,170,210,.35)'}" stroke="rgba(0,0,0,.18)" stroke-width=".6" stroke-linejoin="round"/></svg>`;const c=EMC[k]||EMC.y;return`<span style="display:inline-flex;align-items:center;justify-content:center;width:${s}px;height:${s}px;border-radius:50%;vertical-align:-4px;margin-right:2px;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.9) 0 10%,${c[0]} 36%,${c[1]} 100%);box-shadow:inset -2px -3px 5px rgba(0,0,0,.28),0 2px 5px rgba(0,0,0,.4)">${c[2]?`<svg viewBox="0 0 24 24" width="${Math.round(s*.66)}" height="${Math.round(s*.66)}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))">${c[2]}</svg>`:''}</span>`};
const stars=(n,t=3)=>Array.from({length:t},(_,i)=>em(i<n?'star':'star0',14)).join('');
const TCL={g:'g',y:'y',r:'r',b:''},DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fm=m=>{m=(m+1440)%1440;const h=Math.floor(m/60);return(h%12||12)+':'+String(m%60).padStart(2,'0')+(h<12?' AM':' PM')};
const dur=m=>{m=Math.max(0,Math.round(m));return(m>=60?Math.floor(m/60)+'h ':'')+m%60+'m'};
const lsun=(y,m)=>{const d=new Date(Date.UTC(y,m+1,0));d.setUTCDate(d.getUTCDate()-d.getUTCDay());return d};
const nsun=(y,m,n)=>{const d=new Date(Date.UTC(y,m,1));d.setUTCDate(1+(7-d.getUTCDay())%7+7*(n-1));return d};
const INF={
dead:{t:'r',r:''+em('stop')+' Avoid',mk:'Nothing. Rest, or only map levels.',av:'Everything: wide spreads and random moves.',how:'Do not trade. Mark D1/H4 structure, the Asian range and key levels for London.',why:'Only Sydney is open. Liquidity is extremely thin with wide spreads, random movement and no institutional flow whatsoever.'},
asia:{t:'y',r:''+stars(2)+' Low edge, be patient',mk:'USD/JPY, AUD/JPY, EUR/JPY, GBP/JPY, AUD/USD, NZD/USD, Gold ranges',av:'Indices (NQ/ES/US30), EUR/USD, GBP/USD',how:'Range trading and liquidity sweeps at clear range extremes, only when very clear. Keep size small, mark the Asian high and low for London, watch BoJ news.',why:'Asian liquidity builds slowly and price consolidates in tight bands. Liquidity pools collect above and below the Asian highs and lows, and indices are mostly dead.'},
lon:{t:'g',r:''+stars(3)+' High edge',mk:'EUR/USD, GBP/USD, EUR/GBP, GER40 (JPY and EUR pairs also active)',av:'Chasing the first break, it is often a fake',how:'Wait for the sweep of the Asian high or low, then enter with the D1/H4 trend: breakouts, HTF trend continuation, order block and FVG entries.',why:'Highest institutional volume of the morning. Expansion starts here and most HTF trend moves begin at the London open, often faking out the Asian range first. Liquidity left by Asia gets swept.'},
mid:{t:'r',r:''+em('warn')+' Low edge',mk:'Nothing worth forcing. Prepare for the NY window.',av:'Everything (midday grind)',how:'Stand aside or stay very small. Mark PDH/PDL and the London high and low, set alerts.',why:'London midday grind: no institutional flow and price churns sideways, so trend line entries fail.'},
pre:{t:'b',r:''+em('wait')+' Prepare',mk:'Watch NQ, ES, US30, Gold, EUR/USD, GBP/USD',av:'ORB entries before the cash open (valid only from the NYSE/NASDAQ cash open)',how:'Mark levels, set alerts, check the economic calendar and wait for the cash open.',why:'New York desks are arriving, but the ORB range only forms from the cash open. Entering earlier means trading pre-market noise.'},
prime:{t:'g',r:''+em('fire')+' '+stars(3)+' Prime window',mk:'NASDAQ (NQ), S&P 500 (ES), US30, Gold, plus EUR/USD and GBP/USD',av:'Compressed ORB days (first 30 min range under 10 pts on NQ)',how:'ORB + FVG continuation and PDH/PDL sweeps, aligned with the D1/H4 trend. Let the first 30 minutes form, then trade the break and retest.',why:'NYSE/NASDAQ cash open. Participation and momentum peak, and FVGs, order blocks, PDH/PDL sweeps and ORB setups all fire here. US data (CPI, NFP, FOMC) can be explosive.'},
ovl:{t:'g',r:''+em('fire')+' '+stars(3)+' Highest liquidity',mk:'All majors, Gold, NQ/ES',av:'Entries right before major news',how:'Trend breaks and momentum expansion in the direction of the HTF trend.',why:'European and American desks are both active: the largest candles, clearest structure and tightest spreads of the day.'},
nyc:{t:'y',r:''+stars(2)+' Medium edge',mk:'USD/CAD, Oil (WTI), NQ, ES, USD/JPY',av:'Chasing moves as volume fades',how:'Continuation and PDH/PDL sweeps only. Take A+ setups and expect smaller moves than in the overlap.',why:'Aggressive continuation after London set the direction, but European desks have left so volume is thinner.'},
late:{t:'r',r:''+em('stop')+' Stand aside',mk:'Thin USD pairs only, not worth it',av:'Everything',how:'Stand aside. No setup beats a bad setup.',why:'Volume collapses after the main NY move. Retail traders chase ghosts, with no structure and no edge.'},
closed:{t:'b',r:'Weekend',mk:'Nothing to trade. Prepare for the week.',av:'-',how:'Review the week in Analytics, mark D1/H4 structure and levels, note high-impact news (CPI, NFP, FOMC, GDP), set your risk % and daily loss limit, then write the journal.',why:'Forex closes after the Friday New York session and reopens with Sydney on Sunday night. Nothing is lost by waiting.'}};
const FXC=[['Trending market','Trend line break + FVG continuation',''+stars(3)+' Best fit'],['HTF expansion phase','ORB breakout + PDH/PDL sweep continuation',''+stars(3)+' Best fit'],['London open manipulation','Wait for the sweep of the Asian high or low, then take the HTF entry',''+stars(3)+' High probability'],['Range-bound / consolidation','Liquidity sweep reversal at range extremes (S&R)',''+stars(2)+' Works with patience'],['High volatility (news event)','Breakout momentum after the news, wait for confirmation',''+stars(2)+' Conditional'],['Session exhaustion (late NY)','AVOID. No setup beats a bad setup.',''+em('stop')+' Do not trade'],['Low volume / Asian indices','Avoid indices. JPY and Gold ranges only if very clear',''+em('warn')+' Situational'],['Pre-news compression','Mark levels, set alerts, enter only after the news clears',''+em('warn')+' Wait for clarity']];
function fxSt(){const t=new Date(Date.now()+108e5),date=t.toISOString().slice(0,10),m=t.getUTCHours()*60+t.getUTCMinutes(),dow=t.getUTCDay(),y=t.getUTCFullYear(),d0=new Date(date+'T00:00:00Z'),
uw=d0>=lsun(y,2)&&d0<lsun(y,9)?0:1,sw=d0>=nsun(y,2,2)&&d0<nsun(y,10,1)?0:1,au=d0>=nsun(y,9,1)||d0<nsun(y,3,1),
LO=600-60*uw,LC=1140-60*uw,NO=900+60*sw,NY=990+60*sw,LT=1260+60*sw,NC=1440+60*sw,OS=Math.max(LO,NO),OE=Math.min(LC,NC),le=Math.max(0,NC-1440),sy=au?1440:1380,pe=NY+120,q=Math.max(pe,OE),
P=[[0,le,'late'],[le,180,'dead'],[180,LO,'asia'],[LO,720,'lon'],[720,NO,'mid'],[NO,NY,'pre'],[NY,pe,'prime'],[pe,q,'ovl'],[q,LT,'nyc'],[LT,1440,'late']].filter(p=>p[1]>p[0]),
closed=dow===6&&m>=le||dow===0&&m<sy,ph=P.find(p=>m>=p[0]&&m<p[1]),i=P.indexOf(ph),nx=P[i+1]||P[0],
wk=!closed&&(dow===5&&i===P.length-1?1440+le-m:dow===6&&i===0?le-m:0),
nIn=i===P.length-1?1440-m+nx[0]:nx[0]-m,rIn=closed?(dow===6?1440-m+sy:sy-m):0;
return{date,m,dow,uw,sw,au,LO,LC,NO,NY,LT,NC,OS,OE,sy,le,P,closed,ph,nx,wk,nIn,rIn,k:closed?'closed':ph[2]}}
function fxDay(date){const set=S.misc.fxset||{},T=(S.col.trades||[]).filter(t=>t.date===date&&t.status!=='Open'),pl=T.reduce((a,t)=>a+(+t.pl||0),0),lim=(+(set.bal||10000))*(+(set.dl===undefined||set.dl===''?3:set.dl))/100;let st=0;for(const t of T){if(+t.pl<0)st++;else break}return{n:T.length,pl,lim,hit:lim>0&&pl<=-lim,st}}
function fxV(s){const x=S.misc.fxctx||{},d=fxDay(s.date),n=[],I=INF[s.k];let stop=0;
if(s.closed)return{tone:'b',head:'MARKET CLOSED',n};
if(d.hit){stop=1;n.push(`Daily loss limit reached (${d.pl.toFixed(2)} against a limit of -${d.lim.toFixed(2)}). Rule 4: stop trading for today.`)}
if(d.st>=3){stop=1;n.push(d.st+' losses in a row today. Journal and reset before any new trade. Revenge trading is how accounts get damaged.')}else if(d.st===2)n.push('2 losses in a row: slow down, consider 0.5% risk and take only A+ setups.');
if(x.news==='soon'){stop=1;n.push('Major news within 30 minutes: spreads widen and stops get hunted. Wait for the data.')}
if(x.news==='out')n.push('News just released: wait for confirmation before entering.');
if(['dead','mid','late'].includes(s.k)){stop=1;n.push(I.why)}
if(x.htf==='flat'){stop=1;n.push('D1/H4 structure is neutral: trend line entries will fail repeatedly. Wait for structure to form.')}
if(x.htf==='range')n.push('Range-bound HTF: only liquidity-sweep reversals at the range extremes.');
if(x.orb==='tiny'&&['pre','prime'].includes(s.k)){stop=1;n.push('Compressed ORB day: no ORB setup. Wait for real expansion.')}
if(!x.htf)n.push('Set your D1/H4 trend below. No clear trend means no trend line trade.');
const g=['prime','ovl'].includes(s.k);
return stop?{tone:'r',head:'STAND ASIDE',n}:s.k==='pre'?{tone:'b',head:'PREPARE, DO NOT ENTER YET',n}:{tone:g||s.k==='lon'?'g':'y',head:g?'TRADE · A+ WINDOW':s.k==='lon'?'TRADE · HIGH EDGE':'TRADE · SELECTIVE, LOW EDGE',n}}
const phNow=()=>({label:FXL[fxSt().k]});
const fxMini=()=>{const s=fxSt(),v=fxV(s);return`<div class=card><h3>Trading now</h3><p><span class="tag ${TCL[v.tone]}">${v.head}</span></p><div class=m>${s.closed?'Weekend: reopens in '+dur(s.rIn):FXL[s.k]+' · '+INF[s.k].r}</div><a class=l onclick="go('fx')">Open session advisor</a></div>`};
function fxBoard(s){const a=[[s.NY,Math.min(1440,1380+60*s.sw)]],b=[[s.OS,s.OE]],c=[[0,s.LO]],I=[['NASDAQ (NQ)',a,b,c],['S&P 500 (ES)',a,b,c],['US30 (Dow)',a,b,c],['Gold (XAUUSD)',[[s.NO,s.LC]],[[s.NO,1440]],[[s.LT,1440]]],['EUR/USD',[[s.LO,s.LC]],b,c],['GBP/USD',[[s.LO,s.LC]],b,c],['USD/JPY',[[180,720],[s.NO,1440]],b,[[s.LT,1440]]],['Oil (WTI)',[[s.NO,Math.min(1440,1380+60*s.sw)]],b,c]],inw=w=>w.some(([x,y])=>s.m>=x&&s.m<y),tx=w=>w.map(([x,y])=>fm(x)+'–'+fm(y)).join(' + ');
return`<h3 style="margin:16px 0 6px">Instrument board</h3><div class=tw><table><tr><th>Instrument</th><th>Right now</th><th>Best window (EAT)</th><th>Avoid</th></tr>${I.map(([n,o,al,av])=>{const st=s.closed?['Closed','']:inw(av)?['Avoid','r']:inw(o)&&inw(al)?['Prime','g']:inw(o)?['In window','g']:inw(al)?['Secondary','y']:['Off-hours',''];return`<tr><td>${n}</td><td><span class="tag ${st[1]}">${st[0]}</span></td><td>${tx(o)}</td><td class=m>${tx(av)}</td></tr>`}).join('')}</table></div>`}
function fxLive(){const s=fxSt(),v=fxV(s),I=INF[s.k],d=fxDay(s.date),x=S.misc.fxctx||{},cd=FXC[x.cond],
nx=s.closed?`Reopens in ${dur(s.rIn)} (Sydney ${fm(s.sy)}). First strong window is the London open at ${fm(s.LO)}.`:s.wk?`Weekend close in ${dur(s.wk)}.`:`Phase ends in ${dur(s.ph[1]-s.m)}. Next: ${FXL[s.nx[2]]} at ${fm(s.nx[0])}.`,
ss=[['Sydney',s.au?s.m<540:s.m>=1380||s.m<480,fm(s.au?0:1380)+'–'+fm(s.au?540:480)],['Tokyo',s.m>=180&&s.m<720,'3:00 AM–12:00 PM'],['London',s.m>=s.LO&&s.m<s.LC,fm(s.LO)+'–'+fm(s.LC)],['New York',s.m>=s.NO||s.m<s.le,fm(s.NO)+'–'+fm(s.NC)]];
const card=(h,t)=>`<div class=card><h3>${h}</h3><p class=m style="margin:8px 0 0;color:var(--tx)">${t}</p></div>`;
return`<div class="card ${v.tone==='r'?'warn':''}"><div class=hd><h3>${DN[s.dow]} ${s.date} · ${fm(s.m)} EAT</h3><span class="tag ${TCL[v.tone]}" style="font-size:14px">${v.head}</span></div>
<div style="font-size:24px;font-family:Georgia,serif">${FXL[s.k]} <span class=m style="font-size:14px">${I.r}</span></div><p class=m>${nx}</p>
${v.n.map(t=>`<div class=st><span>${em('warn')} ${t}</span></div>`).join('')}
<div class=row style="margin-top:10px">${s.closed?'':ss.map(q=>`<span class="tag ${q[1]?'g':''}" title="${q[2]}">${q[0]} ${q[1]?'open':'closed'} · ${q[2]}</span>`).join('')}${!s.closed&&s.m>=s.OS&&s.m<s.OE?'<span class="tag g">'+em('fire')+' LDN–NY overlap live</span>':''}</div></div>
<div class=g>${card('Look at',I.mk)}${card('How to trade it',I.how+(cd&&!s.closed?`<br><br><b>Your market condition (${cd[0]}):</b> ${cd[1]} <span class=m>${cd[2]}</span>`:''))}${card('Why',I.why)}${card('Avoid',I.av)}</div>
<div class=card><h3>Today at a glance</h3><div class=m>${d.n} closed trade${d.n===1?'':'s'} · P&L ${d.pl>0?'+':''}${d.pl.toFixed(2)} · daily loss limit -${d.lim.toFixed(2)} · losing streak ${d.st}${s.closed?'':' · UTC+3, no DST in Kenya'}</div></div>${s.closed?'':fxBoard(s)}`}
function fxMap(){const s=fxSt(),pr=`${fm(s.OS)}–${fm(s.OE)}`;return`<div class=card><h3>The day map (EAT, adjusted for today’s clock changes)</h3><p class=m>UK is on ${s.uw?'winter time (GMT)':'summer time (BST)'}, the US on ${s.sw?'winter time (EST)':'summer time (EDT)'}, Kenya stays UTC+3. London ${fm(s.LO)}–${fm(s.LC)} · New York ${fm(s.NO)}–${fm(s.NC)} · NYSE cash open ${fm(s.NY)} · Overlap ${s.OE>s.OS?pr:'none'}. Winter times are derived from the DST table in your deck.</p><div class=tw><table><tr><th>Time</th><th>Phase</th><th>Edge</th><th>Focus</th></tr>${s.P.map(p=>{const I=INF[p[2]],on=!s.closed&&s.ph===p;return`<tr ${on?'style="background:rgba(120,165,255,.18)"':''}><td style="white-space:nowrap">${fm(p[0])} – ${fm(p[1])}</td><td><b>${FXL[p[2]]}</b>${on?'<span class=tag style="margin-left:6px">now</span>':''}</td><td>${I.r}</td><td class=m>${I.mk}</td></tr>`}).join('')}</table></div></div>`}

setInterval(()=>{if(FXT==='now'&&(location.hash.slice(1)||'dash')==='fx')fxRef()},30000);
function fxNow(){const x=S.misc.fxctx||{},sel=(k,o)=>`<select onchange="fxCtx('${k}',this.value)">${o.map(([v,l])=>`<option value="${v}" ${(x[k]||'')===v?'selected':''}>${l}</option>`).join('')}</select>`;
return`<div id=fxlive>${fxLive()}</div><div class=card><div class=hd><h3>Tell the advisor what the market is doing</h3><button onclick="S.misc.fxctx={};save();render()">Reset for a new day</button></div><p class=m>Your strategy is conditions-based, so these checks can turn a good time window into a stand-aside.</p>
<label class=m>D1 / H4 structure</label>${sel('htf',[['','Not checked yet'],['clear','Clear trend (HH/HL or LH/LL)'],['range','Range / deep consolidation'],['flat','Neutral / flat, no catalyst']])}
<label class=m>News</label>${sel('news',[['none','No major news near'],['soon','Major news within 30 min (CPI, NFP, FOMC, GDP)'],['out','News just released, wait for confirmation'],['post','Post-news directional move']])}
<label class=m>NY ORB range (first 30 min)</label>${sel('orb',[['','Not applicable yet'],['ok','Expanding normally'],['tiny','Compressed (under 10 pts on NQ)']])}
